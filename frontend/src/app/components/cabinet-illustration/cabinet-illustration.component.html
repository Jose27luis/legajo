<svg #lienzo viewBox="0 0 280 232" aria-hidden="true" focusable="false">
  <ellipse class="sombra" cx="140" cy="222" rx="104" ry="7" />
  <rect class="pata" x="62" y="210" width="14" height="10" rx="2" />
  <rect class="pata" x="204" y="210" width="14" height="10" rx="2" />
  <rect class="mueble" x="44" y="14" width="192" height="198" rx="10" />

  <rect class="hueco" x="56" y="26" width="168" height="54" rx="5" />

  <g class="carpeta">
    <rect class="lomo" x="92" y="20" width="30" height="10" rx="2" />
    <rect class="cuerpo" x="64" y="27" width="152" height="40" rx="3" />
  </g>
  <g class="carpeta">
    <rect class="lomo" x="134" y="26" width="30" height="10" rx="2" />
    <rect class="cuerpo" x="64" y="33" width="152" height="40" rx="3" />
  </g>
  <g class="carpeta destacada">
    <rect class="lomo" x="176" y="32" width="30" height="10" rx="2" />
    <rect class="cuerpo" x="64" y="39" width="152" height="40" rx="3" />
  </g>

  <g class="cajon-abierto">
    <rect class="frente" x="56" y="26" width="168" height="54" rx="5" />
    <rect class="porta" x="114" y="36" width="52" height="15" rx="2" />
    <text class="rango" x="140" y="47">01 – 04</text>
    <rect class="tirador" x="116" y="60" width="48" height="7" rx="3.5" />
  </g>

  @for (cajon of cajonesCerrados; track cajon.rango) {
    <g>
      <rect class="frente" x="56" [attr.y]="cajon.y" width="168" height="54" rx="5" />
      <rect class="porta" x="114" [attr.y]="cajon.y + 10" width="52" height="15" rx="2" />
      <text class="rango" x="140" [attr.y]="cajon.y + 21">{{ cajon.rango }}</text>
      <rect class="tirador" x="116" [attr.y]="cajon.y + 34" width="48" height="7" rx="3.5" />
    </g>
  }
</svg>
