<header class="cabecera-seccion">
  <div>
    <p class="antetitulo">Módulo de reportes</p>
    <h2>Reportes y expedientes digitales</h2>
    <p>Filtra la información del personal, expórtala a Excel o imprímela, y descarga los documentos PDF de cada trabajador.</p>
  </div>
  <div class="atajos">
    <a class="boton chico" routerLink="/search">Búsqueda avanzada</a>
    <a class="boton chico" routerLink="/statistics">Estadísticas</a>
    <a class="boton chico" routerLink="/alerts">Alertas</a>
  </div>
</header>

<nav class="pestanas" aria-label="Reportes disponibles">
  @for (pestana of pestanas; track pestana.ruta) {
    <a [routerLink]="pestana.ruta" routerLinkActive="activa" ariaCurrentWhenActive="page">{{ pestana.etiqueta }}</a>
  }
</nav>

<router-outlet />
