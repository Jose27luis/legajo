@if (errorDetalle(); as mensaje) {
  <div class="aviso error" role="alert">
    {{ mensaje }}
    <button type="button" class="boton chico" (click)="detalle.reload()">Reintentar</button>
  </div>
} @else if (detalle.hasValue()) {
  <router-outlet />
} @else {
  <p class="celda-vacia">Cargando legajo</p>
}
