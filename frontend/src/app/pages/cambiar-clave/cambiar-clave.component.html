<main class="pantalla">
  <div class="panel">
    <app-marca [tamano]="40" />
    <h1>Crea tu contraseña</h1>
    @if (sesion.usuario(); as usuario) {
      <p class="bajada">
        {{ usuario.nombreCompleto }}, tu cuenta tiene una contraseña temporal. Cámbiala para empezar a usar el sistema.
      </p>
    }
    <app-formulario-clave (cambiada)="continuar()" />
    <button type="button" class="salir" (click)="cerrarSesion()" [disabled]="saliendo()">Cerrar sesión</button>
  </div>
</main>
