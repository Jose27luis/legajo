name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  lint:
    name: Lint · ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        paquete: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.paquete }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.paquete }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.paquete == 'backend'
        run: pnpm prisma:generate
      - run: pnpm lint

  formato:
    name: Formato · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  tipos:
    name: Tipos · ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        paquete: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.paquete }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.paquete }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.paquete == 'backend'
        run: pnpm prisma:generate
      - run: pnpm typecheck

  pruebas:
    name: Pruebas y cobertura · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Pruebas con cobertura
        run: pnpm test:coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/frontend/coverage-summary.json ]; then
            node -e "const t=require('./coverage/frontend/coverage-summary.json').total;const f=(n,k)=>'| '+n+' | '+t[k].pct+' % | '+t[k].covered+' / '+t[k].total+' |';console.log(['### Cobertura del frontend','','| Métrica | Cobertura | Cubierto |','|---|---|---|',f('Líneas','lines'),f('Sentencias','statements'),f('Funciones','functions'),f('Ramas','branches')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/frontend
          if-no-files-found: ignore
          retention-days: 14

  auditoria:
    name: Auditoría de dependencias · ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        paquete: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.paquete }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high --ignore-registry-errors

  compilacion:
    name: Compilación · ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, formato, tipos, pruebas]
    strategy:
      fail-fast: false
      matrix:
        paquete: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.paquete }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.paquete }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.paquete == 'backend'
        run: pnpm prisma:generate
      - run: pnpm build

  e2e:
    name: Pruebas E2E · sistema completo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compilacion]
    steps:
      - uses: actions/checkout@v4
      - name: Variables del stack de pruebas
        run: |
          clave_bd=$(openssl rand -hex 16)
          clave_admin="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$clave_bd"
          echo "::add-mask::$clave_admin"
          {
            echo "NODE_ENV=production"
            echo "PUERTO=3000"
            echo "POSTGRES_USER=legajos"
            echo "POSTGRES_PASSWORD=$clave_bd"
            echo "POSTGRES_DB=legajos"
            echo "DATABASE_URL=postgresql://legajos:$clave_bd@postgres:5432/legajos"
            echo "REDIS_URL=redis://redis:6379"
            echo "SESION_MINUTOS=30"
            echo "COOKIE_SEGURA=false"
            echo "ADMIN_USUARIO=admin.e2e"
            echo "ADMIN_NOMBRE=Administrador E2E"
            echo "ADMIN_CORREO=admin.e2e@example.com"
            echo "ADMIN_CLAVE=$clave_admin"
            echo "RESTIC_REPOSITORY=/data/respaldos"
            echo "RESTIC_PASSWORD=$(openssl rand -hex 24)"
            echo "RESPALDO_CRON=0 1 * * *"
          } > .env
          echo "E2E_USUARIO=admin.e2e" >> "$GITHUB_ENV"
          echo "E2E_CLAVE=$clave_admin" >> "$GITHUB_ENV"
      - name: Levantar el sistema
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar dependencias y Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Pruebas E2E
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:3600
        run: pnpm e2e
      - name: Registros del sistema
        if: failure()
        run: docker compose logs --no-color --tail 200 api worker web
      - name: Informe E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: |
            frontend/e2e-informe
            frontend/e2e-resultados
          if-no-files-found: ignore
          retention-days: 14
      - name: Apagar el sistema
        if: always()
        run: docker compose down -v

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [compilacion, auditoria]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: ejecucion
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
