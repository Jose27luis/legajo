name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high --ignore GHSA-ggr8-5vv4-36mx --ignore-registry-errors

  frontend:
    name: Frontend · lint, pruebas, cobertura y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Pruebas con cobertura
        run: pnpm test:coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/frontend/coverage-summary.json ]; then
            node -e "const t=require('./coverage/frontend/coverage-summary.json').total;const f=(n,k)=>'| '+n+' | '+t[k].pct+' % | '+t[k].covered+' / '+t[k].total+' |';console.log(['### Cobertura del frontend','','| Métrica | Cobertura | Cubierto |','|---|---|---|',f('Líneas','lines'),f('Sentencias','statements'),f('Funciones','functions'),f('Ramas','branches')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/frontend
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm build
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high --ignore-registry-errors

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: ejecucion
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
